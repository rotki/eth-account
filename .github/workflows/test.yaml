name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        python-version: "3.14"

    - name: Run Ruff Lint
      run: uv run --group lint ruff check .

    - name: Run Ruff Format
      run: uv run --group lint ruff format --check .

    - name: Run mdformat
      run: uv run --group lint mdformat --check *.md

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        python-version: "3.14"

    - name: Run MyPy
      run: uv run --group lint --group test mypy .

  core:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Core Tests
      run: uv run --group test coverage run -m pytest -n auto --maxprocesses=4 tests/core

    - name: Report Coverage
      run: uv run --group test coverage report

  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        python-version: "3.14"

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tests/integration/js-scripts/package-lock.json

    - name: Build js-scripts
      working-directory: tests/integration/js-scripts
      run: |
        npm install
        npm install -g .

    - name: Run Integration Tests
      run: uv run --group test pytest tests/integration
